# ============================================================
#  Smart Parking Management System — Application Properties
# ============================================================

spring.application.name=SmartParking

# -----------------------------------------------
# ACTIVE PROFILE: 'h2' for demo, 'mysql' for prod
# Change to 'mysql' when MySQL is running locally
# -----------------------------------------------
spring.profiles.active=h2

# -----------------------------------------------
# H2 IN-MEMORY DATABASE (Profile: h2)
# -----------------------------------------------
spring.datasource.url=jdbc:h2:mem:smartparkingdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Schema + Seed Data (auto-run on startup with H2)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# -----------------------------------------------
# MYSQL DATABASE (Profile: mysql) — uncomment below
# and comment out H2 section when using real MySQL
# -----------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/smartparkingdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password_here
# spring.sql.init.mode=always

# -----------------------------------------------
# HIKARICP CONNECTION POOL
# -----------------------------------------------
spring.datasource.hikari.pool-name=SmartParkingHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# -----------------------------------------------
# BILLING CONFIGURATION
# -----------------------------------------------
parking.rate.per30min=10
parking.rate.currency=INR
parking.emergency.override.threshold.minutes=120

# -----------------------------------------------
# SERVER
# -----------------------------------------------
server.port=8080
server.servlet.context-path=/

# -----------------------------------------------
# FIREBASE RESOURCE SERVER (JWT Validator)
# -----------------------------------------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://securetoken.google.com/smart-parking-app-java

# -----------------------------------------------
# LOGGING
# -----------------------------------------------
logging.level.com.smartparking=DEBUG
logging.level.org.springframework.jdbc=DEBUG

# -----------------------------------------------
# RAZORPAY PAYMENT GATEWAY
# -----------------------------------------------
razorpay.key.id=${RAZORPAY_KEY_ID:YOUR_RAZORPAY_KEY}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:YOUR_RAZORPAY_SECRET}
